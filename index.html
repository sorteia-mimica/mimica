  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6d28d9">
  <!-- Aplica claro/escuro antes da primeira pintura (sem piscar). Sem escolha salva, segue o sistema. -->
  <script>
    (function () {
      var sistema = matchMedia('(prefers-color-scheme: dark)');
      function aplicar() {
        var escolha = null;
        try { escolha = localStorage.getItem('mimica:tema'); } catch (e) {}
        var escuro = escolha ? escolha === 'escuro' : sistema.matches;
        document.documentElement.dataset.theme = escuro ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = escuro ? '#110c1d' : '#6d28d9';
      }
      window.aplicarTema = aplicar;
      aplicar();
      sistema.addEventListener('change', aplicar);
    })();
  </script>
  <meta name="description" content="Sorteia itens de mímica por tema e dificuldade, marca o tempo e soma os pontos.">
