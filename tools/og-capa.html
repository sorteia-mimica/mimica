<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:Ubuntu,system-ui,sans-serif;color:#fff;display:flex;align-items:center;gap:64px;padding:0 90px;box-sizing:border-box;
background:radial-gradient(700px 500px at 10% 10%,#a21caf 0,transparent 70%),radial-gradient(800px 600px at 95% 100%,#4338ca 0,transparent 70%),linear-gradient(135deg,#6d28d9,#7e22ce);}
.emoji{flex:none;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:190px;box-shadow:0 30px 60px -20px rgba(0,0,0,.45)}
h1{font-size:92px;margin:0 0 18px;font-weight:800;letter-spacing:-2px;line-height:1}
p{font-size:36px;margin:0 0 34px;opacity:.92;line-height:1.25}
.chips{display:flex;gap:14px}
.chip{font-size:28px;font-weight:700;padding:10px 24px;border-radius:999px;background:#fff}
.f{color:#15803d}.m{color:#b45309}.d{color:#b91c1c}
</style></head><body>
<div class="emoji">🎭</div>
<div><h1>Sorteia Mímica</h1><p>Sorteio, cronômetro e placar.<br>É só passar o celular. 📱</p>
<div class="chips"><span class="chip f">Fácil · 1</span><span class="chip m">Médio · 2</span><span class="chip d">Difícil · 4</span></div></div>
</body></html>
